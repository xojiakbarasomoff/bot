# Kept at the repository root, not moved under instagram/ with the rest of
# the project: GitHub only reads workflows from .github/workflows at the
# root, so a copy inside instagram/ would never run and the gate would go
# quiet without anything failing to say so. Every `run` step is executed
# from instagram/ instead (see defaults below).
#
# The path filter keeps this from running on commits that only touch the
# Telegram half of the repository -- this workflow neither builds nor tests
# that code, so a red X on it would be noise.
name: Instagram CI

on:
  push:
    branches: [main, second]
    paths:
      - "instagram/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, second]
    paths:
      - "instagram/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: instagram

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dental_ig_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dental_ig_assistant
      REDIS_URL: redis://localhost:6379/0
      MODEL_PROVIDER: gemini
      GEMINI_API_KEY: gemini-test-placeholder
      OPENAI_API_KEY: sk-test-placeholder
      WEBHOOK_VERIFY_TOKEN: ci-test-verify-token
      META_APP_SECRET: ci-test-app-secret
      SESSION_SECRET_KEY: ci-test-session-secret-key-not-for-real-use

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # defaults.run.working-directory does not apply to `uses` steps,
          # so the cache key has to name the manifest explicitly or it is
          # looked for at the root, where it no longer is.
          cache-dependency-path: instagram/pyproject.toml

      # Generated per run rather than written into this file. A Fernet key
      # committed to the repository is a real key in public history even
      # when it only ever encrypted test rows -- and one sitting in a CI
      # config is the kind of value that gets copied into a deployment
      # because it was the one that worked. A Fernet key is 32 random bytes
      # in url-safe base64, which openssl and tr produce without needing
      # the Python dependencies installed yet.
      - name: Generate a throwaway encryption key
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: Mypy
        run: mypy app

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Pytest with coverage gate
        # TODO: 80 is the current floor (tenant-isolation suite lands at 99%);
        # raise further as more service/API/worker code lands with tests.
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
