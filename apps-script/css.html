<style>
  /* Tailwind covers the layout; this file holds only what utilities cannot
     express cleanly — the calendar cell states and the loading shimmer. */

  .nav-btn {
    display: grid;
    place-items: center;
    height: 2rem;
    width: 2rem;
    border-radius: 0.5rem;
    border: 1px solid #e2e8f0;
    color: #475569;
    font-size: 1.1rem;
    line-height: 1;
    background: #fff;
    transition: background-color 0.15s, color 0.15s;
  }
  .nav-btn:hover { background: #f8fafc; color: #0f172a; }

  .day {
    position: relative;
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border-radius: 0.6rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: #334155;
    background: transparent;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.12s, color 0.12s, border-color 0.12s;
  }
  .day:hover { background: #f1f5f9; }
  .day.muted { color: #cbd5e1; }          /* neighbouring month */
  .day.today { border-color: #a5b4fc; color: #4338ca; font-weight: 600; }
  .day.selected,
  .day.selected:hover { background: #4f46e5; color: #fff; border-color: #4f46e5; }

  /* The busy marker. Sits under the number, and turns white on the selected
     day so it stays visible against the indigo fill. */
  .day .dot {
    position: absolute;
    bottom: 0.28rem;
    height: 0.3rem;
    width: 0.3rem;
    border-radius: 9999px;
    background: #6366f1;
  }
  .day.selected .dot { background: #fff; }

  .skeleton {
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  #refresh-icon.spinning { display: inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { animation: rise 0.22s ease-out both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
</style>
